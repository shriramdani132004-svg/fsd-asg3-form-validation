<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="form-card">
            <h1>User Registration</h1>
            <p class="subtitle">Create your account</p>

            <form id="registrationForm" novalidate>

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name">
                    <small id="nameError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="text" id="email" placeholder="Enter your email">
                    <small id="emailError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter 10-digit phone number" maxlength="10">
                    <small id="phoneError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                    <small id="passwordError" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password">
                    <small id="confirmPasswordError" class="error"></small>
                </div>

                <button type="submit">Register</button>

                <div id="successMessage" class="success"></div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
